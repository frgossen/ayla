name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --no-deps skips torch/numpy/ninja. Nothing in the suite below imports
      # them, and torch alone is a ~200MB download for no gain.
      - name: Install
        run: |
          pip install --no-deps -e .
          pip install pytest

      # The GPU half of the suite is excluded rather than skipped. Its skipif
      # marks guard the test bodies, but the modules JIT-compile a CUDA
      # extension at import (registry's @register -> load_inline), so a runner
      # with no GPU dies during collection, before a mark can apply.
      - name: pytest
        run: |
          pytest -q \
            --ignore=tests/gemm_collection \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_ptx_runtime.py
