[workspace]
name = "ayla"
version = "0.0.0"
description = "A highly experimental compiler toolkit for generating PTX code for SOTA GEMM kernels on NVIDIA GPUs"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
pytest = "*"
ninja = "*"
numpy = "*"

[pypi-dependencies]
ayla = { path = ".", editable = true }

[tasks]
install = "pip install torch --index-url https://download.pytorch.org/whl/cu128"
test = "pytest"
bench = "python benchmarks/bench_gemm_collection.py"
