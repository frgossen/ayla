[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ayla"
version = "0.0.0"
description = "A highly experimental compiler toolkit for generating PTX code for SOTA GEMM kernels on NVIDIA GPUs"
requires-python = ">=3.12"
dependencies = [
    "ninja",
    "numpy",
    "torch",
]

[project.optional-dependencies]
bench = ["matplotlib"]
dev = ["pyright", "pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["ayla*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pyright]
# Expand this boundary as the transformation layer gains precise annotations.
include = [
    "ayla/__init__.py",
    "ayla/base",
    "ayla/gemm_collection/__init__.py",
    "ayla/gemm_collection/auto_matmul_4096_wgmma256_wg_tma_store.py",
    "ayla/gemm_collection/loop_4x4_matmul_4096.py",
    "ayla/gemm_collection/loop_8x8_matmul_4096.py",
    "ayla/gemm_collection/naive_matmul_4096_loop.py",
    "ayla/gemm_collection/pranjalssh_4096.py",
    "ayla/gemm_collection/pranjalssh_4096_pipelined.py",
    "ayla/gemm_collection/tma_matmul_4096.py",
    "ayla/gpu_dialect.py",
    "ayla/passes/__init__.py",
    "ayla/passes/_loop_utils.py",
    "ayla/passes/_utils.py",
    "ayla/passes/canonicalize.py",
    "ayla/passes/dce.py",
    "ayla/passes/insert_syncs.py",
    "ayla/passes/fuse_async.py",
    "ayla/passes/pack_smem_allocs.py",
    "ayla/passes/pipeline_loop.py",
    "ayla/passes/schedule_async.py",
    "ayla/passes/unroll_loop.py",
    "ayla/pytree.py",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"

# ---------------------------------------------------------------------------
# pixi environment management (formerly pixi.toml). Name/version/description,
# the Python version, and the runtime/dev deps are read from [project] above —
# not duplicated here. pixi installs this project editable, so its
# [project.dependencies] (ninja, numpy, torch) come along; the optional
# ``dev`` and ``bench`` features provide tooling for their respective tasks.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
ninja = "*"
numpy = "*"

[tool.pixi.environments]
default = ["dev", "bench"]

[tool.pixi.tasks]
install = { cmd = "pip install torch --index-url https://download.pytorch.org/whl/cu128 && pip install -e ." }
test = "pytest"
lint = "ruff check"
typecheck = "pyright"
bench = "python -m benchmarks.bench_gemm_collection"
