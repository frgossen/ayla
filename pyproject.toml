[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ayla"
version = "0.0.0"
description = "A highly experimental compiler toolkit for generating PTX code for SOTA GEMM kernels on NVIDIA GPUs"
requires-python = ">=3.12"
dependencies = [
    "ninja",
    "numpy",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["ayla*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# pixi environment management (formerly pixi.toml). Name/version/description,
# the Python version, and the runtime/dev deps are read from [project] above —
# not duplicated here. pixi installs this project editable, so its
# [project.dependencies] (ninja, numpy, torch) come along; the ``dev`` feature
# pulls in pytest for the ``test`` task.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
ninja = "*"
numpy = "*"

[tool.pixi.environments]
default = ["dev"]

[tool.pixi.tasks]
install = { cmd = "pip install torch --index-url https://download.pytorch.org/whl/cu128 && pip install -e ." }
test = "pytest"
bench = "python benchmarks/bench_gemm_collection.py"
