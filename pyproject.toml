[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ayla"
version = "0.0.0"
description = "A highly experimental compiler toolkit for generating PTX code for SOTA GEMM kernels on NVIDIA GPUs"
requires-python = ">=3.12"
dependencies = [
    "ninja",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ayla*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
